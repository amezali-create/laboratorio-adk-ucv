[tool.poetry]
name = "laboratorio-adk-ucv"
version = "0.1.0"
description = "Mono-agente academico UCV con Google ADK, Poetry, GitHub Actions y SonarQube"
authors = ["Nombre del estudiante <correo@ucvvirtual.edu.pe>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
google-adk = "*"
python-dotenv = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
